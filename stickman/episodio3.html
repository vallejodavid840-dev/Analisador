const LY=P({hip:50,lean:0,rot:-1.57,f1x:26,f1y:6,f2x:-6,f2y:12,h1x:-40,h1y:70,h2x:40,h2y:80,tilt:0});
const KNEEL=P({hip:36,lean:.35,tilt:.1,f1x:28,f2x:-26,f2y:6,h1x:24,h1y:40,h2x:0,h2y:50});
const DAZE=P({hip:52,lean:.5,tilt:.3,f1x:20,f2x:-30,h1x:10,h1y:50,h2x:-10,h2y:44});

const KICKH=P({hip:68,lean:-.35,f1x:68,f1y:98,f2x:-14,f2y:0,h1x:-30,h1y:112,h2x:-20,h2y:92});
const BLOCK=P({hip:56,lean:.2,f1x:30,f2x:-30,h1x:26,h1y:114,h2x:34,h2y:100});
const BLOCKS=P({hip:52,lean:-.05,f1x:44,f2x:-16,h1x:22,h1y:112,h2x:30,h2y:98});
const FLIP=P({hip:56,lean:.2,f1x:24,f1y:40,f2x:4,f2y:44,h1x:20,h1y:40,h2x:6,h2y:36});
const JUMP=P({hip:76,lean:.1,f1x:14,f1y:30,f2x:-14,f2y:20,h1x:30,h1y:168,h2x:10,h2y:158});
const SMASHW=P({hip:74,lean:-.1,f1x:20,f1y:30,f2x:-20,f2y:26,h1x:-10,h1y:172,h2x:-6,h2y:162});
const SMASH=P({hip:70,lean:.5,f1x:24,f1y:40,f2x:-18,f2y:36,h1x:60,h1y:86,h2x:54,h2y:78});
const LANDC=P({hip:36,lean:.6,f1x:34,f2x:-26,h1x:44,h1y:50,h2x:-30,h2y:60});
const WIN=P({hip:68,lean:0,tilt:-.1,f1x:22,f2x:-22,h1x:12,h1y:150,h2x:-4,h2y:70,idle:.5});
const AIRR1=P({hip:60,lean:-.2,rot:-.4,f1x:26,f1y:40,f2x:-20,f2y:28,h1x:-30,h1y:80,h2x:-50,h2y:110});
const SLAM=P({hip:60,lean:.1,rot:-1.2,f1x:30,f1y:40,f2x:-18,f2y:66,h1x:-30,h1y:60,h2x:-56,h2y:84});

/* ================= GUION (tiempo de escena) ================= */
const DEFW=P({hip:58,lean:.2,h1x:10,h1y:128,h2x:20,h2y:96,wa:-.7});
const DEF1=P({hip:56,lean:.3,f1x:36,h1x:46,h1y:86,h2x:16,h2y:92,wa:.3});
const DEF2=P({hip:60,lean:.2,h1x:48,h1y:114,h2x:16,h2y:92,wa:.1});
const DEF3=P({hip:56,lean:.3,f1x:36,h1x:44,h1y:96,h2x:16,h2y:92,wa:.2});
const SLW=P({hip:54,lean:.25,f1x:34,h1x:0,h1y:132,h2x:16,h2y:92,wa:-.9});
const SLH=P({hip:48,lean:.6,f1x:44,f2x:-34,h1x:60,h1y:66,h2x:6,h2y:92,wa:.5});
const SLC=P({hip:50,lean:.55,f1x:44,f2x:-34,h1x:62,h1y:100,h2x:6,h2y:92,wa:.1});
const RTW=P({hip:58,lean:.1,h1x:-14,h1y:112,h2x:16,h2y:96,tilt:-.1});
const RTF=P({hip:58,lean:.3,h1x:70,h1y:112,h2x:10,h2y:96});
const LEANB=P({hip:56,lean:-.5,tilt:-.3,f1x:20,f2x:-36,h1x:-10,h1y:116,h2x:-30,h2y:96});
const GRAB=P({hip:56,lean:.3,f1x:34,f2x:-28,h1x:36,h1y:100,h2x:30,h2y:92});
const THR=P({hip:44,lean:1.0,tilt:.2,f1x:30,f2x:-34,h1x:44,h1y:42,h2x:34,h2y:36});
const CHG=P({hip:46,lean:.3,tilt:-.1,f1x:38,f2x:-36,h1x:-22,h1y:62,h2x:-28,h2y:54});
const BEAMP=P({hip:54,lean:.5,tilt:-.15,f1x:40,f2x:-44,h1x:76,h1y:98,h2x:70,h2y:94});

const F=2.2,T=x=>F+x,GT=T(10.2);
const K=(t,x,p,o)=>Object.assign({t,x,y:0,f:1,p,e:'ss',arc:0,spin:0,tr:0},o||{},{t,x,p});
const A=[
 K(0,-170,STANCE),K(T(.78),-170,STANCE),
 K(T(.84),-170,DEFW,{e:'out'}),K(T(.90),-170,DEF1,{e:'in'}),K(T(.96),-170,DEFW),K(T(1.02),-170,DEF2,{e:'in'}),K(T(1.08),-170,DEFW),K(T(1.14),-170,DEF3,{e:'in'}),
 K(T(1.35),-170,STANCE),K(T(1.45),-170,DASHW,{e:'in'}),K(T(1.68),84,DASH,{e:'out',tr:'w'}),
 K(T(1.72),84,SLW,{e:'out'}),K(T(1.80),90,SLH,{e:'in'}),K(T(1.92),84,SLW),K(T(2.0),92,SLH,{e:'in'}),K(T(2.08),84,SLW),K(T(2.17),94,SLC,{e:'in'}),
 K(T(2.45),94,SLC),K(T(2.52),120,FLYA,{y:90,e:'out'}),K(T(2.7),196,FLYB,{y:190,spin:-1}),K(T(2.88),246,FLYA,{y:70,e:'in'}),K(T(3.0),262,LY,{y:-42,e:'in'}),
 K(T(3.7),262,LY,{y:-42}),K(T(3.95),262,KNEEL,{f:-1,y:0}),K(T(4.15),262,STANCE,{f:-1}),
 K(T(4.2),262,KCROUCH,{f:-1,e:'out'}),K(T(4.55),380,FLIP,{f:-1,arc:110,spin:-1,e:'lin'}),K(T(4.7),380,STANCE,{f:-1,e:'out'}),
 K(T(4.85),380,CHG,{f:-1}),K(T(5.5),380,CHG,{f:-1}),K(T(5.56),380,BEAMP,{f:-1,e:'out'}),K(T(7.1),380,BEAMP,{f:-1}),
 K(T(7.5),380,STANCE,{f:-1}),K(T(8.3),380,WIN,{f:-1}),K(GT,380,WIN,{f:-1})
];
const R=[
 K(0,170,STANCE,{f:-1}),K(T(.6),170,STANCE,{f:-1}),
 K(T(.72),170,RTW,{f:-1}),K(T(.78),170,RTF,{f:-1,e:'in'}),K(T(.84),170,RTW,{f:-1}),K(T(.90),170,RTF,{f:-1,e:'in'}),K(T(.96),170,RTW,{f:-1}),K(T(1.02),170,RTF,{f:-1,e:'in'}),
 K(T(1.2),170,STANCE,{f:-1}),K(T(1.72),170,STANCE,{f:-1}),K(T(1.80),200,LEANB,{f:-1,e:'out'}),K(T(1.92),190,STANCE,{f:-1}),K(T(2.0),190,DUCK,{f:-1,e:'out'}),K(T(2.10),190,STANCE,{f:-1}),
 K(T(2.17),190,GRAB,{f:-1,e:'in'}),K(T(2.45),190,GRAB,{f:-1}),K(T(2.55),190,THR,{f:-1,e:'in'}),K(T(2.9),190,THR,{f:-1}),K(T(3.2),190,STANCE,{f:-1}),
 K(T(3.35),190,STANCE,{f:1}),K(T(4.0),190,STANCE,{f:1}),K(T(4.2),190,KCROUCH,{f:1,e:'out'}),K(T(4.55),-30,FLIP,{f:1,arc:110,spin:-1,e:'lin'}),K(T(4.7),-30,STANCE,{f:1,e:'out'}),
 K(T(4.85),-30,CHG,{f:1}),K(T(5.5),-30,CHG,{f:1}),K(T(5.56),-30,BEAMP,{f:1,e:'out'}),K(T(7.12),-30,BEAMP,{f:1}),
 K(T(7.22),-30,REEL,{f:1,e:'out'}),K(T(7.45),-250,FLYB,{f:1,y:170,spin:-2}),K(T(7.85),-430,LY,{f:1,y:-42,e:'in'}),K(GT,-430,LY,{f:1,y:-42})
];
const HITS=[
 {g:T(.90),v:'A',k:'spark',p:.5,stop:.03,at:[52,100]},
 {g:T(1.02),v:'A',k:'spark',p:.5,stop:.03,at:[52,100]},
 {g:T(1.14),v:'A',k:'spark',p:.5,stop:.03,at:[52,100]},
 {g:T(2.17),v:'R',k:'block',p:.8,stop:.08,at:[40,100]},
 {g:T(3.0),v:'A',k:'slam',p:1.2,stop:.12,at:[0,10]},
 {g:T(5.56),abs:[175,98],k:'clash',p:.7,stop:0},
 {g:T(7.15),v:'R',k:'big',p:1.7,stop:.2,at:[0,100],id:'blast'},
 {g:T(7.85),v:'R',k:'slam',p:1.4,stop:.12,at:[0,10]}
];
const SLOW=[{a:T(7.1),b:T(8.0),r:.3}];
const SFXG=[{g:T(.78),k:'card'},{g:T(.90),k:'card'},{g:T(1.02),k:'card'},{g:T(1.45),k:'whoosh'},{g:T(2.5),k:'whoosh'},{g:T(4.2),k:'whoosh'},
 {g:T(4.8),k:'charge'},{g:T(5.56),k:'beam'},{g:T(7.1),k:'slowmo'}];
/* cartas de energía: salen de la mano de Rojo y chocan con la daga */
const PROJ=[T(.78),T(.90),T(1.02)].map(t=>({t0:t,t1:t+.12,x0:100,y0:112,x1:-96,y1:100}));
/* rayo: punto donde chocan los dos rayos */
const XM=[[T(5.56),175],[T(5.9),252],[T(6.25),215],[T(6.45),130],[T(6.85),160],[T(7.0),110],[T(7.15),-30]];
function xm(g){
  if(g<=XM[0][0])return XM[0][1];
  for(let i=0;i<XM.length-1;i++)if(g<XM[i+1][0]){return lerp(XM[i][1],XM[i+1][1],ss((g-XM[i][0])/(XM[i+1][0]-XM[i][0])))}
  return XM[XM.length-1][1];
}
const SLASHES=[T(.90),T(1.02),T(1.14),T(1.80),T(2.0)];

/* ================= Mapa de tiempo (cámara lenta y detención) ================= */
let segs=[],TOTAL=0;
(function(){
  const cuts=new Set([0,GT]);
  HITS.forEach(h=>cuts.add(h.g));SLOW.forEach(s=>{cuts.add(s.a);cuts.add(s.b)});
  const c=[...cuts].sort((a,b)=>a-b);let r=0;
  for(let i=0;i<c.length-1;i++){
    const g0=c[i],g1=c[i+1];
    HITS.filter(h=>h.g===g0&&h.stop).forEach(h=>{segs.push({r0:r,r1:r+h.stop,g0,g1:g0,fr:1});r+=h.stop});
    let rate=1;const mid=(g0+g1)/2;SLOW.forEach(s=>{if(mid>s.a&&mid<s.b)rate=s.r});
    const dr=(g1-g0)/rate;segs.push({r0:r,r1:r+dr,g0,g1,rate});r+=dr;
  }
  TOTAL=r;
})();
function r2g(r){
  for(const s of segs)if(r>=s.r0&&r<s.r1)return s.fr?s.g0:s.g0+(r-s.r0)*s.rate;
  return GT;
}
function g2rStart(g){
  for(const s of segs)if(s.fr&&Math.abs(s.g0-g)<1e-6)return s.r0;
  for(const s of segs)if(!s.fr&&g>=s.g0-1e-9&&g<s.g1)return s.r0+(g-s.g0)/s.rate;
  return TOTAL;
}
HITS.forEach(h=>h.r=g2rStart(h.g));

/* ================= Evaluación de claves ================= */
const EASE={lin:k=>k,ss:ss,out:k=>1-(1-k)*(1-k),in:k=>k*k};
function lpose(a,b,k){const o={};for(const key in a)o[key]=lerp(a[key],b[key],k);return o}
function evalKeys(keys,t){
  const n=keys.length;
  if(t<=keys[0].t)return{x:keys[0].x,y:keys[0].y,f:keys[0].f,p:Object.assign({},keys[0].p),tr:0};
  if(t>=keys[n-1].t){const k=keys[n-1];return{x:k.x,y:k.y,f:k.f,p:Object.assign({},k.p),tr:0}}
  let i=0;while(t>=keys[i+1].t)i++;
  const a=keys[i],b=keys[i+1],u=(t-a.t)/(b.t-a.t),e=EASE[b.e](u);
  const p=lpose(a.p,b.p,e);
  p.rot+=b.spin*Math.PI*2*e;
  return{x:lerp(a.x,b.x,e),y:lerp(a.y,b.y,e)+b.arc*4*u*(1-u),f:b.f!==a.f&&u>.5?b.f:a.f,p,tr:b.tr||0};
}
function fighter(keys,t,ph){
  const s=evalKeys(keys,t);
  const w=Math.sin(9*t+ph);
  s.p.hip+=s.p.idle*2.6*w;s.p.h1y+=s.p.idle*3*Math.sin(9*t+ph+1.2);s.p.f1x+=s.p.idle*2*w;
  return s;
}
function states(t){return{A:fighter(A,t,0),R:fighter(R,t,1.7)}}

/* ================= Cámara con cortes (simulada, determinista) ================= */
const SHOTS=[
 {t:0,m:'auto'},
 {t:T(2.1),m:'fix',x:s=>(s.A.x+s.R.x)/2,y:()=>105,z:2.4,rate:3},
 {t:T(2.5),m:'auto'},
 {t:T(2.92),m:'fix',x:()=>255,y:()=>30,z:1.9,roll:.06,rate:2},
 {t:T(3.5),m:'auto'},
 {t:T(4.75),m:'fix',x:s=>s.A.x,y:()=>100,z:3.4,roll:-.04,rate:2},
 {t:T(5.1),m:'fix',x:s=>s.R.x,y:()=>100,z:3.4,roll:.04,rate:2},
 {t:T(5.4),m:'fix',x:()=>175,y:()=>40,z:1.25,roll:-.05,rate:1.2},
 {t:T(5.56),m:'fix',x:()=>175,y:()=>95,z:1.2,rate:2},
 {t:T(5.95),m:'fix',x:(s,g)=>xm(g),y:()=>100,z:2.6,rate:6},
 {t:T(6.4),m:'fix',x:()=>175,y:()=>35,z:1.5,roll:.07,rate:1.5},
 {t:T(6.8),m:'fix',x:s=>s.A.x-40,y:()=>105,z:3.0,rate:3},
 {t:T(7.05),m:'fix',x:()=>150,y:()=>90,z:1.3,rate:3},
 {t:T(7.22),m:'fix',x:()=>-100,y:()=>90,z:1.0,rate:3},
 {t:T(8.0),m:'fix',x:s=>s.A.x,y:()=>95,z:1.8,rate:3}
];
const CAMN=Math.ceil(GT*120)+2,camArr=new Float32Array(CAMN*4);
(function(){
  let cx=0,cy=80,z=1.5,rl=0,si=-1;
  for(let i=0;i<CAMN;i++){
    const t=i/120,s=states(t);
    let k=0;while(k+1<SHOTS.length&&t>=SHOTS[k+1].t)k++;
    const sh=SHOTS[k];let tx,ty,tz,tr=sh.roll||0,rate=sh.rate||5;
    if(sh.m==='fix'){tx=sh.x(s,t);ty=sh.y(s,t);tz=sh.z}
    else{
      const sep=Math.abs(s.A.x-s.R.x);
      tz=clamp(2.1-sep/560,1.35,1.85);tx=(s.A.x+s.R.x)/2;ty=78+Math.max(0,(s.A.y+s.R.y)/2)*.5;
    }
    if(t<F){tz=1.5;tx=0;ty=80}
    if(k!==si){si=k;cx=tx;cy=ty;z=tz;rl=tr}
    const kk=1-Math.exp(-(1/120)*rate);
    cx+=(tx-cx)*kk;cy+=(ty-cy)*kk;z+=(tz-z)*kk;rl+=(tr-rl)*kk;
    camArr[i*4]=cx;camArr[i*4+1]=cy;camArr[i*4+2]=z;camArr[i*4+3]=rl;
  }
})();
function camAt(t){
  const f=clamp(t,0,GT)*120,i=Math.floor(f),u=f-i,j=Math.min(i+1,CAMN-1);
  return[0,1,2,3].map(c=>lerp(camArr[i*4+c],camArr[j*4+c],u));
}

/* ================= Dibujo del muñeco ================= */
function ik(ax,ay,tx,ty,l1,l2,dir){
  let dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy);const mx=l1+l2-.01;

    ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx+c*14,hy+s*14);ctx.lineTo(hx+c*62,hy+s*62);ctx.stroke();

function mesa(par,hgt,col1,col2,seed,camx,z,hy){

  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-50,hy);
  const i0=Math.floor((off-50)/step)-1;
  for(let i=i0;i<i0+CW/step+4;i++){
    const x=i*step-off,h=hgt*(.35+.65*hash(i*3.1+seed)),h2=hgt*(.35+.65*hash((i+1)*3.1+seed));
    const flat=step*.55;
    ctx.lineTo(x,hy-h*0.6);ctx.lineTo(x+step*.12,hy-h);ctx.lineTo(x+step*.12+flat,hy-h);ctx.lineTo(x+step*.7,hy-h2*.6);
  }

}

function shadow(st){

function star(x,y,r,age,col){

function dust(x,y,age,n,spread,seed){

/* ================= Efectos de energía ================= */
const CA='#47d6ff',CR='#5dff7a';

function beam(x0,y0,x1,col,core,w,g,al){
  if(Math.abs(x1-x0)<2)return;
  ctx.save();ctx.lineCap='round';
  for(const [wd,a,c] of [[w*2.6,.16,col],[w*1.7,.34,col],[w,.9,col],[w*.45,1,core]]){
    ctx.globalAlpha=(al==null?1:al)*a;ctx.strokeStyle=c;ctx.lineWidth=wd*(1+.07*Math.sin(g*95));
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0+Math.sin(g*60)*1.5);ctx.stroke();
  }

}
function auraFx(s,k,g,col,seed){
  if(k<=0)return;
  for(let i=0;i<20;i++){
    const ph=(g*1.3+hash(i+seed))%1,x=s.x+(hash(i*3+seed)-.5)*70,y=ph*190+4,r=11*(1-ph)+2;
    ctx.fillStyle=col;ctx.globalAlpha=k*(1-ph)*.8;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();

  ctx.strokeStyle=col;ctx.lineWidth=5;ctx.globalAlpha=k*.5;ctx.beginPath();ctx.ellipse(s.x,2,60+14*Math.sin(g*14),12,0,0,7);ctx.stroke();ctx.globalAlpha=1;

function rocks(cx,k,g,seed){
  if(k<=0)return;
  for(let i=0;i<7;i++){
    const x=cx+(hash(i+seed)-.5)*190,y=14+k*(40+90*hash(i+seed*2))+Math.sin(g*3+i)*6;

function card(x,y,ang,col){

  ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle='#ffffff';ctx.fillRect(-13,-8,26,16);
  ctx.shadowBlur=0;ctx.fillStyle=col;ctx.fillRect(-9,-5,18,10);ctx.restore();

function slashArc(s,age,sgn){

  ctx.save();ctx.translate(s.x+s.f*34,s.y+96);ctx.scale(s.f,1);ctx.globalAlpha=1-k*k;ctx.lineCap='round';
  for(let i=0;i<3;i++){ctx.strokeStyle=i===0?'#ffffff':'#bfe4ff';ctx.lineWidth=(i===0?14:8)*(1-k*.5);
    ctx.beginPath();ctx.arc(0,0,74+i*10,1.25,1.25-2.3*ss(k*1.5+.1),true);ctx.stroke()}

/* ================= Render ================= */
const HB=HITS.find(h=>h.id==='blast');
function render(r){
  const sc=cv.width/CW;
  const g=r2g(r),st=states(g);
  const cm=camAt(g);let cx=cm[0],cy=cm[1],z=cm[2];const roll=cm[3];
  let shx=0,shy=0,zp=0,flash=0;
  for(const h of HITS){
    const age=r-h.r;if(age<0)continue;
    const e=Math.exp(-age*9);
    shx+=h.p*9*e*Math.sin(age*85);shy+=h.p*7*e*Math.cos(age*70);
    zp+=h.p*.045*Math.exp(-age*7);
    if(h.k==='big'||h.k==='slam')flash=Math.max(flash,.8*Math.exp(-age*18)*(h.p>1.3?1:.6));
  }
  const bc=ss((g-T(5.56))/.2)*(1-ss((g-T(7.15))/.1));
  shx+=bc*3.5*Math.sin(r*90);shy+=bc*3.5*Math.cos(r*77);
  z+=zp;
  ctx.setTransform(sc,0,0,sc,0,0);
  ctx.save();ctx.translate(CW/2,CH/2);ctx.rotate(roll);const bs=1+Math.abs(roll)*1.8;ctx.scale(bs,bs);ctx.translate(-CW/2,-CH/2);
  background(cx,cy,z,sc,r);ctx.restore();
  ctx.setTransform(sc,0,0,sc,0,0);ctx.translate(CW/2+shx,CH/2+shy);ctx.rotate(roll);ctx.scale(z,-z);ctx.translate(-cx,-cy);
  ground(cx,cy,z);
  shadow(st.A);shadow(st.R);
  const aK=ss((g-T(4.8))/.9)*(1-ss((g-T(7.1))/.3)),rK=ss((g-T(4.8))/.9)*(1-ss((g-T(7.15))/.25));
  // grietas y rocas flotando durante la carga
  const ca=g-T(4.85);
  if(ca>0&&g<T(7.4)){crack(380,ca*1.2);crack(-30,ca*1.2)}
  rocks(380,aK,g,3);rocks(-30,rK,g,8);
  for(const h of HITS){
    const age=r-h.r;if(age<0)continue;
    if(h.abs)continue;
    const hs=states(h.g)[h.v];
    if(h.k==='slam'){ring(hs.x,0,230,age,'#fff3d0',10);dust(hs.x,0,age,9,160,h.g*7);crack(hs.x,age);debris(hs.x,0,age,h.g*3,14)}
  }
  for(const [t0,t1,who] of [[T(1.5),T(1.7),'A'],[T(4.2),T(4.7),'A'],[T(4.2),T(4.7),'R'],[T(3.0),T(3.3),'A']]){
    if(g>t0&&g<t1)for(let i=0;i<4;i++){const s=states(g-i*.05)[who];ctx.fillStyle=`rgba(255,240,212,${.45-i*.1})`;ctx.beginPath();ctx.arc(s.x-s.f*10,14+i*4,14+i*8,0,7);ctx.fill()}
  }
  for(const who of ['A','R']){
    const s=st[who];
    if(s.tr){const white=(s.tr==='w');
      for(let i=3;i>=1;i--){const gs=states(Math.max(0,g-i*.03))[who];
        drawActor(gs,white?'#ffffff':(who==='A'?BLUE:RED),white?.55-i*.12:.32-i*.08,{weapon:who==='A'})}}
  }
  auraFx(st.A,aK,g,CA,1);auraFx(st.R,rK,g,CR,5);
  drawActor(st.R,RED,1,{aura:{col:CR,k:rK}});
  drawActor(st.A,BLUE,1,{weapon:true,aura:{col:CA,k:aK}});
  // cartas de energía
  for(const p of PROJ){
    if(g>=p.t0&&g<p.t1){
      const u=(g-p.t0)/(p.t1-p.t0),x=lerp(p.x0,p.x1,u),y=lerp(p.y0,p.y1,u);
      ctx.strokeStyle='rgba(255,90,220,.5)';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+70,lerp(p.y0,y,.5)+(y-p.y0)*0);ctx.lineTo(x,y);ctx.stroke();
      card(x,y,g*30,'#ff3fd0');
    }
    if(g>=p.t1&&g<p.t1+.35){
      const u=(g-p.t1)/.35,x=p.x1+130*u,y=p.y1+190*u-60*u*u;
      ctx.globalAlpha=1-u;card(x,y,g*30,'#ff3fd0');ctx.globalAlpha=1;
    }
  }
  // carga de energía en las manos
  if(g>=T(5.0)&&g<T(5.56)){
    const k=ss((g-T(5.0))/.56);
    for(const [w,col] of [['A',CA],['R',CR]]){const s=st[w];orb(s.x+s.f*-24,60,8+28*k,col)}
  }
  // rayos
  if(g>=T(5.56)&&g<T(7.7)){
    const m=xm(g),a=st.A,rr=st.R,fade=1-ss((g-T(7.35))/.3);
    if(g<T(7.15)){
      const grow=1+.5*ss((g-T(5.56))/1.4);
      beam(a.x-60,98,m,CA,'#ffffff',16*grow,g);
      beam(rr.x+60,98,m,CR,'#eaffee',16*grow,g);
      orb(m,98,30+10*Math.sin(g*55)+10*grow,'#ffffff');
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';
      const sd=Math.floor(g*40);
      for(let i=0;i<14;i++){const an=hash(sd+i)*6.28,r0=24,r1=50+hash(sd+i*3)*60;ctx.beginPath();ctx.moveTo(m+Math.cos(an)*r0,98+Math.sin(an)*r0);ctx.lineTo(m+Math.cos(an)*r1,98+Math.sin(an)*r1);ctx.stroke()}
    }else{
      beam(a.x-60,98,-110,CA,'#ffffff',22,g,fade);
      orb(-30,98,60*(1-ss((g-T(7.15))/.5)),'#ffffff');
    }
  }
  // impactos
  for(const h of HITS){
    const age=r-h.r;if(age<0)continue;
    let px,py;
    if(h.abs){px=h.abs[0];py=h.abs[1]}else{const hs=states(h.g)[h.v];px=hs.x+hs.f*h.at[0];py=hs.y+h.at[1]}
    if(h.k==='spark'){star(px,py,38,age,'#fff3a8');ring(px,py,50,age,'#ffd6f5',5)}
    if(h.k==='big')star(px,py,110*h.p,age,'#ffd23f');
    if(h.k==='block'){star(px,py,48,age,'#bfe4ff');ring(px,py,70,age,'#fff',6)}
    if(h.k==='slam')star(px,28,120,age,'#ffb83a');
    if(h.k==='clash'){ring(px,py,170,age,'#ffffff',10);star(px,py,90,age,'#ffffff')}
  }
  for(const sg of SLASHES){slashArc(states(sg).A,r-g2rStart(sg),1)}
  // ---- pantalla ----
  ctx.setTransform(sc,0,0,sc,0,0);
  const tint=ss((g-T(7.15))/.06)*(1-ss((g-T(8.0))/.35));
  if(tint>0){
    ctx.fillStyle=`rgba(190,40,30,${.26*tint})`;ctx.fillRect(0,0,CW,CH);
    const ha=r-HB.r;
    if(ha>=0&&ha<1.2){
      const k=ha/1.2,bx=CW/2+60,by=CH/2-30,br=40+300*ss(k*1.4);
      const rg=ctx.createRadialGradient(bx,by,br*.1,bx,by,br);rg.addColorStop(0,'rgba(255,230,120,.95)');rg.addColorStop(.5,'rgba(255,90,40,.85)');rg.addColorStop(1,'rgba(255,60,30,0)');
      ctx.globalAlpha=1-k*.7;ctx.fillStyle=rg;ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.strokeStyle=`rgba(255,255,255,${.35*tint})`;ctx.lineWidth=3;
    for(let i=0;i<46;i++){const an=i/46*Math.PI*2+hash(i)*.2,r0=240+hash(i+4)*120,r1=r0+240+hash(i+9)*300;
      ctx.beginPath();ctx.moveTo(CW/2+Math.cos(an)*r0,CH/2+Math.sin(an)*r0*.6);ctx.lineTo(CW/2+Math.cos(an)*r1,CH/2+Math.sin(an)*r1*.6);ctx.stroke()}
  }
  // poder: brillo de pantalla durante el choque
  if(bc>0){const bg=ctx.createRadialGradient(CW/2,CH/2,50,CW/2,CH/2,CH);bg.addColorStop(0,`rgba(255,255,255,${.0})`);bg.addColorStop(1,`rgba(40,180,255,${.22*bc})`);ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH)}
  const vg=ctx.createRadialGradient(CW/2,CH/2,CH*.45,CW/2,CH/2,CH*.95);vg.addColorStop(0,'rgba(60,20,0,0)');vg.addColorStop(1,'rgba(60,20,0,.32)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,CW,CH)}
  // rótulos
  vsCard(g,sc);
  const fa=g-F;
  if(fa>0&&fa<1.0){const k=ss(fa/.15);ctext('¡PELEA!',CW/2,CH/2-40,160,'#fff','#10131b',(1-ss((fa-.7)/.3)),-.05,.6+.4*k+.05*Math.sin(fa*30))}
  const pa=g-T(4.8);
  if(pa>0&&pa<.9)ctext('¡PODER ESPECIAL!',CW/2,CH*.2,100,'#ffd23f','#10131b',Math.min(1,pa*6)*(1-ss((pa-.6)/.3)),-.04,.8+.2*ss(pa/.15));
  const ca2=g-T(5.62);
  if(ca2>0&&g<T(7.1))ctext('¡¡HAAAAAA!!',CW/2+Math.sin(r*70)*5,CH*.13+Math.cos(r*60)*4,110,'#fff','#1d3fbf',Math.min(1,ca2*5)*(1-ss((g-T(6.95))/.15)),0,1);
  const ba=r-HB.r;if(ba>=0&&ba<1.2)ctext('¡BOOOOM!',CW/2,CH*.26,160,'#fff','#b5171e',1-ss((ba-.8)/.4),-.06,.7+.5*ss(ba/.12));
  const w=ss((g-T(8.6))/.4);
  if(w>0){
    ctx.fillStyle=`rgba(10,12,20,${.55*w})`;ctx.fillRect(0,0,CW,CH);
    ctext('¡AZUL GANA!',CW/2,CH*.22,150,'#fff','#1d3fbf',w,0,.8+.2*w);
    ctext('EPISODIO 3 · CONTINUARÁ...',CW/2,CH*.22+100,40,'#ffc233','#10131b',ss((g-T(9.1))/.4));
  }
}

/* ================= Sonido ================= */
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function nbuf(d){const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*d|0),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function tone(type,f0,f1,dur,vol,dl){const c=AC,t0=c.currentTime+(dl||0),o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(gn).connect(c.destination);o.start(t0);o.stop(t0+dur+.05)}
function noise(ft,fr,dur,vol,type){const c=AC,t0=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),gn=c.createGain();s.buffer=nbuf(dur);f.type=type||'lowpass';f.frequency.value=fr;gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(f).connect(gn).connect(c.destination);s.start(t0)}
function sfx(k){
  if(!soundOn||!ac())return;
  if(k==='hit'){tone('sine',180,55,.18,.7);noise(0,1800,.12,.5)}
  if(k==='big'){tone('sine',140,40,.3,.9);noise(0,2400,.22,.7)}
  if(k==='block'){noise(0,6000,.08,.6,'highpass');tone('square',900,500,.08,.15)}
  if(k==='slam'){tone('sine',90,28,.6,1);noise(0,900,.5,.9)}
  if(k==='land')tone('sine',110,50,.14,.5);
  if(k==='whoosh'){const c=AC,t0=c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),gn=c.createGain();s.buffer=nbuf(.4);f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(500,t0);f.frequency.exponentialRampToValueAtTime(2600,t0+.25);gn.gain.setValueAtTime(.001,t0);gn.gain.linearRampToValueAtTime(.3,t0+.1);gn.gain.exponentialRampToValueAtTime(.001,t0+.4);s.connect(f).connect(gn).connect(c.destination);s.start(t0)}
  if(k==='slowmo')tone('sawtooth',500,80,.8,.12);
  if(k==='card'){noise(0,7000,.06,.35,'highpass');tone('triangle',1400,2200,.08,.12)}
  if(k==='spark'){noise(0,8000,.1,.5,'highpass');tone('square',1800,900,.1,.12)}
  if(k==='clash'){tone('sine',200,60,.5,.6);noise(0,3000,.3,.5)}
  if(k==='charge'){tone('sine',90,700,.8,.22);tone('sawtooth',60,300,.8,.08)}
  if(k==='beam'){tone('sawtooth',180,160,1.6,.14);tone('square',362,330,1.6,.05);noise(0,2500,1.5,.18,'bandpass')}
}
const EV=[];
HITS.forEach(h=>EV.push({r:h.r,k:h.k}));
SFXG.forEach(s=>EV.push({r:g2rStart(s.g),k:s.k}));

/* ================= Reproductor ================= */
let t=0,playing=false,last=0;
const playB=document.getElementById('play'),seek=document.getElementById('seek'),tm=document.getElementById('tm');
seek.max=TOTAL.toFixed(3);
function ui(){seek.value=t;tm.textContent=t.toFixed(1)+' / '+TOTAL.toFixed(1)+' s'}
function size(){const w=cv.clientWidth||CW,dpr=Math.min(window.devicePixelRatio||1,2),px=Math.min(1920,Math.round(w*dpr));if(cv.width!==px){cv.width=px;cv.height=Math.round(px*CH/CW)}}
function setPlaying(p){playing=p;playB.textContent=p?'❚❚ Pausa':(t>=TOTAL?'↻ Repetir':'▶ Ver');if(p){ac();if(AC&&AC.state==='suspended')AC.resume()}}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing){const prev=t;t=Math.min(TOTAL,t+dt);for(const e of EV)if(e.r>prev&&e.r<=t)sfx(e.k);if(t>=TOTAL)setPlaying(false)}
  size();render(t);ui();requestAnimationFrame(loop);
}
playB.onclick=()=>{if(!playing&&t>=TOTAL)t=0;setPlaying(!playing)};
document.getElementById('restart').onclick=()=>{t=0;setPlaying(true)};
cv.onclick=()=>{if(!playing&&t>=TOTAL)t=0;setPlaying(!playing)};
seek.oninput=()=>{t=parseFloat(seek.value);if(playing)setPlaying(false);playB.textContent='▶ Ver'};
document.getElementById('snd').onclick=e=>{soundOn=!soundOn;e.target.textContent='Sonido: '+(soundOn?'sí':'no')};
window.__render=(x)=>{t=x;size();render(x)};
window.__renderG=(g)=>{const r=g2rStart(g);t=r;size();render(r+.001)};
window.__info=()=>({TOTAL,GT,F});
(document.fonts&&document.fonts.load?document.fonts.load('30px Bangers').catch(()=>{}):Promise.resolve()).then(()=>{last=performance.now();requestAnimationFrame(loop)});
})();
</script>
